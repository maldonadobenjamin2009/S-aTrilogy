name: PS4 PKG (OpenOrbis homebrew)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'dist/**'
      - 'ps4/**'
      - '.github/workflows/ps4-pkg.yml'
      - 'CMakeLists.txt'

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-latest
    # OpenOrbis documents this image as its supported Docker-based workflow.
    # Use the image directly instead of the non-existent openorbis/toolchain-action.
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    steps:
      - name: Install Git and Git LFS in the toolchain container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git git-lfs ca-certificates
          git lfs install --system

      - name: Checkout source and tracked ROM/assets (Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify OpenOrbis package tools and runtime modules
        shell: bash
        run: |
          set -euo pipefail
          : "${OO_PS4_TOOLCHAIN:?OpenOrbis container did not set OO_PS4_TOOLCHAIN}"
          for tool in create-fself create-gp4 PkgTool.Core; do
            if [ ! -x "$OO_PS4_TOOLCHAIN/bin/linux/$tool" ]; then
              echo "::error::OpenOrbis tool not found or not executable: $OO_PS4_TOOLCHAIN/bin/linux/$tool"
              exit 1
            fi
          done
          # The official Docker image installs SDK files, not the sample tree.
          # Runtime modules are shipped under bin/data/modules in the SDK release.
          for module in libc.prx libSceFios2.prx; do
            if [ ! -f "$OO_PS4_TOOLCHAIN/bin/data/modules/$module" ]; then
              echo "::error::Required OpenOrbis runtime module is missing: $OO_PS4_TOOLCHAIN/bin/data/modules/$module"
              exit 1
            fi
          done
          echo "OpenOrbis SDK: $OO_PS4_TOOLCHAIN"
          ls -l "$OO_PS4_TOOLCHAIN/bin/data/modules/libc.prx" "$OO_PS4_TOOLCHAIN/bin/data/modules/libSceFios2.prx"

      - name: Check package inputs
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/main/roms
          test -d dist/assets
          count=$(find dist/main/roms -type f \( -iname '*.gba' -o -iname '*.gbc' -o -iname '*.gb' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No tracked ROM files found under dist/main/roms. Ensure Git LFS assets are available to Actions."
            exit 1
          fi
          test -f ps4/sce_sys/icon0.png
          test -f "$OO_PS4_TOOLCHAIN/lib/libSDL2.a"
          echo "ROMs included in package: $count"
          echo "OpenOrbis SDK: $OO_PS4_TOOLCHAIN"

      - name: Build PS4 ELF and PKG with OpenOrbis
        shell: bash
        run: make -f ps4/Makefile

      - name: Upload PS4 PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvanceTrilogy-PS4-PKG
          path: build-ps4/SonicAdvanceTrilogy-PS4.pkg
          if-no-files-found: error
          retention-days: 14
