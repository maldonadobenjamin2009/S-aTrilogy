name: PS4 PKG (OpenOrbis homebrew)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'third_party/**'
      - 'dist/**'
      - 'ps4/**'
      - '.github/workflows/ps4-pkg.yml'
      - 'CMakeLists.txt'

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-latest
    # OpenOrbis documents this image as its supported Docker-based workflow.
    # Use the image directly instead of the non-existent openorbis/toolchain-action.
    container:
      image: openorbisofficial/toolchain:latest
      options: --user root
    steps:
      - name: Install Git and Git LFS in the toolchain container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git git-lfs ca-certificates curl tar
          git lfs install --system

      - name: Checkout source and tracked ROM/assets (Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Prepare and verify OpenOrbis packaging tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${OO_PS4_TOOLCHAIN:-/lib/OpenOrbisSDK}"
          if [ ! -d "$SDK" ]; then
            echo "::error::OpenOrbis SDK directory not found: $SDK"
            echo "Available SDK directories (diagnostic):"
            find /lib /opt /usr/local -maxdepth 4 -type d -name OpenOrbisSDK -print 2>/dev/null || true
            exit 1
          fi
          export OO_PS4_TOOLCHAIN="$SDK"
          TOOLS="$SDK/bin/linux"
          mkdir -p "$TOOLS"

          # Some published toolchain archives lose executable bits when extracted.
          # Repair permissions on existing command-line tools before checking them.
          if [ -d "$TOOLS" ]; then
            find "$TOOLS" -maxdepth 1 -type f -exec chmod u+x {} +
          fi

          # The container's SDK release may omit create-fself. Build the official
          # upstream v1.3 source as a deterministic fallback rather than failing
          # immediately at the preflight check.
          if [ ! -f "$TOOLS/create-fself" ]; then
            echo "create-fself is absent; building official OpenOrbis/create-fself v1.3"
            if ! command -v go >/dev/null 2>&1; then
              GO_VERSION="1.22.12"
              curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go-linux-amd64.tar.gz
              rm -rf /usr/local/go
              tar -xzf /tmp/go-linux-amd64.tar.gz -C /usr/local
              export PATH="/usr/local/go/bin:$PATH"
            fi
            TMP_FSELF="$(mktemp -d)"
            git clone --depth 1 --branch v1.3 https://github.com/OpenOrbis/create-fself.git "$TMP_FSELF/create-fself"
            (
              cd "$TMP_FSELF/create-fself/cmd/create-fself"
              GOTOOLCHAIN=local go build -modfile=go-linux.mod -o "$TOOLS/create-fself"
            )
            rm -rf "$TMP_FSELF"
          fi
          [ -f "$TOOLS/create-fself" ] && chmod u+x "$TOOLS/create-fself"

          # Show actual paths and permissions so a future SDK-layout mismatch is diagnosable.
          echo "OpenOrbis SDK: $OO_PS4_TOOLCHAIN"
          echo "Linux packaging tools: $TOOLS"
          ls -la "$TOOLS"
          for tool in create-fself create-gp4 PkgTool.Core; do
            if [ ! -x "$TOOLS/$tool" ]; then
              echo "::error::OpenOrbis tool is missing or not executable: $TOOLS/$tool"
              echo "Tool directory contents:"
              ls -la "$TOOLS" || true
              exit 1
            fi
          done

          # Runtime modules are shipped under bin/data/modules in the SDK release.
          for module in libc.prx libSceFios2.prx; do
            if [ ! -f "$SDK/bin/data/modules/$module" ]; then
              echo "::error::Required OpenOrbis runtime module is missing: $SDK/bin/data/modules/$module"
              exit 1
            fi
          done
          ls -l "$SDK/bin/data/modules/libc.prx" "$SDK/bin/data/modules/libSceFios2.prx"

      - name: Check package inputs
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/main/roms
          test -d dist/assets
          count=$(find dist/main/roms -type f \( -iname '*.gba' -o -iname '*.gbc' -o -iname '*.gb' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No tracked ROM files found under dist/main/roms. Ensure Git LFS assets are available to Actions."
            exit 1
          fi
          test -f ps4/sce_sys/icon0.png
          test -f "$OO_PS4_TOOLCHAIN/lib/libSDL2.a"
          echo "ROMs included in package: $count"
          echo "OpenOrbis SDK: $OO_PS4_TOOLCHAIN"

      - name: Build PS4 ELF and PKG with OpenOrbis
        shell: bash
        run: make -f ps4/Makefile

      - name: Upload PS4 PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicAdvanceTrilogy-PS4-PKG
          path: build-ps4/SonicAdvanceTrilogy-PS4.pkg
          if-no-files-found: error
          retention-days: 14
