name: Build and deploy Sonic Advance Trilogy WebAssembly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Verificar compilador
        run: emcc -v

      - name: Configurar compilación web
        run: emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF

      - name: Compilar el programa C para WebAssembly
        run: cmake --build build-web --target SonicAdvanceTrilogy --parallel 2

      - name: Verificar artefactos de WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          echo "Archivos generados por Emscripten:"
          find build-web -maxdepth 2 -type f \( -name '*.html' -o -name '*.js' -o -name '*.wasm' -o -name '*.data' \) -printf '%p (%s bytes)\\n' | sort
          for file in index.html index.js index.wasm index.data; do
            if [[ ! -s "build-web/$file" ]]; then
              echo "::error::Falta build-web/$file. Salida real de build-web:"
              find build-web -maxdepth 3 -type f | sort
              exit 1
            fi
          done

      - name: Preparar sitio de GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site site/licencias
          install -m 0644 build-web/index.html build-web/index.js build-web/index.wasm build-web/index.data site/
          install -m 0644 web/launcher.js web/styles.css web/coi-serviceworker.js site/
          # Incluye todos los artefactos auxiliares que el SDK Emscripten pueda generar.
          for file in build-web/index.*; do
            [[ -f "$file" ]] && install -m 0644 "$file" site/
          done
          install -m 0644 third_party/mgba/LICENSE site/licencias/mGBA-LICENSE-MPL-2.0.txt
          install -m 0644 third_party/DejaVu-LICENSE.txt site/licencias/DejaVu-LICENSE.txt
          touch site/.nojekyll
          echo "Archivos web preparados:"
          find site -maxdepth 3 -type f -printf '%p (%s bytes)\\n' | sort

      - name: Cargar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
