import java.util.zip.ZipInputStream

plugins {
    id 'com.android.application'
}

/* SDL2 se obtiene del repositorio oficial en el primer sync. Se puede evitar
 * la descarga si se coloca manualmente SDL2 2.30.9 en android/SDL2/. */
def sdlVersion = '2.30.9'
def sdlDir = file("$projectDir/../SDL2")
// Dist es la fuente de verdad para el contenido empaquetado: dist/main/roms y dist/assets.
def repositoryDist = file("$projectDir/../../dist")
def generatedBundledAssets = file("$buildDir/generated/bundledAssets")
def generatedLauncherIconRes = file("$buildDir/generated/launcherIconRes")
def sdlCmake = new File(sdlDir, 'CMakeLists.txt')
def sdlJava = new File(sdlDir, 'android-project/app/src/main/java/org/libsdl/app/SDLActivity.java')

def prepareSDL2 = {
    if (sdlCmake.exists() && sdlJava.exists()) return
    if (gradle.startParameter.offline) {
        throw new GradleException("Falta SDL2 2.30.9. Desactiva el modo Offline de Gradle o coloca las fuentes oficiales en ${sdlDir}.")
    }
    logger.lifecycle('Descargando SDL2 oficial para compilar el APK…')
    sdlDir.mkdirs()
    def archive = new File(buildDir, "SDL-release-${sdlVersion}.zip")
    archive.parentFile.mkdirs()
    def url = new URL("https://github.com/libsdl-org/SDL/archive/refs/tags/release-${sdlVersion}.zip")
    def connection = url.openConnection()
    connection.connectTimeout = 20000
    connection.readTimeout = 60000
    connection.inputStream.withCloseable { input -> archive.withOutputStream { output -> output << input } }
    def root = sdlDir.canonicalFile
    new ZipInputStream(new FileInputStream(archive)).withCloseable { zip ->
        def entry
        while ((entry = zip.nextEntry) != null) {
            def name = entry.name
            def slash = name.indexOf('/')
            if (slash >= 0) name = name.substring(slash + 1)
            if (name.isEmpty()) { zip.closeEntry(); continue }
            def target = new File(root, name).canonicalFile
            if (!target.toPath().startsWith(root.toPath())) {
                throw new GradleException("Entrada no válida en el archivo SDL2: ${entry.name}")
            }
            if (entry.isDirectory()) target.mkdirs()
            else {
                target.parentFile.mkdirs()
                target.withOutputStream { output -> output << zip }
            }
            zip.closeEntry()
        }
    }
    if (!sdlCmake.exists() || !sdlJava.exists()) {
        throw new GradleException("La descarga de SDL2 ${sdlVersion} no contiene CMakeLists.txt o SDLActivity.java. Coloca la distribución oficial en ${sdlDir}.")
    }
}

/* Android Studio necesita las fuentes JNI/Java SDL tanto al sincronizar como al
 * invocar CMake. Prepararlas durante la configuración deja el proyecto listo al abrirlo. */
try {
    prepareSDL2()
} catch (Exception ex) {
    if (sdlCmake.exists() && sdlJava.exists()) {
        logger.warn("SDL2 ya está disponible; se ignora un problema secundario de descarga: ${ex.message}")
    } else {
        throw new GradleException("No se pudo preparar SDL2 para Android. Comprueba la conexión o descarga SDL2 ${sdlVersion} y extráelo en ${sdlDir}.", ex)
    }
}

tasks.register('verifyBundledGameData') {
    group = 'verification'
    description = 'Comprueba que dist contiene ROMs y assets que se empaquetarán en el APK.'
    doLast {
        def romDir = new File(repositoryDist, 'main/roms')
        def artDir = new File(repositoryDist, 'assets')
        if (!romDir.isDirectory()) {
            throw new GradleException("No existe ${romDir}. Las ROMs deben estar en dist/main/roms.")
        }
        if (!artDir.isDirectory()) {
            throw new GradleException("No existe ${artDir}. Los recursos deben estar en dist/assets.")
        }
        // El launcher enumera ROMs en el nivel directo de main/roms, no recursivamente.
        def roms = (romDir.listFiles() ?: []).findAll { f ->
            f.isFile() && f.length() > 1024L && ['.gba', '.gbc', '.gb'].any { ext -> f.name.toLowerCase(Locale.ROOT).endsWith(ext) }
        }
        if (roms.isEmpty()) {
            throw new GradleException("No se encontraron ROMs válidas (>1 KiB, .gba/.gbc/.gb) en ${romDir}; comprueba que Git LFS descargó los binarios reales si corresponde.")
        }
        def art = fileTree(artDir).files.findAll { f ->
            f.isFile() && ['.png', '.jpg', '.jpeg', '.webp'].any { ext -> f.name.toLowerCase(Locale.ROOT).endsWith(ext) }
        }
        if (art.isEmpty()) {
            throw new GradleException("No se encontraron imágenes en ${artDir}; los recursos deben estar incluidos en el repositorio.")
        }
        logger.lifecycle("Contenido del APK: ${roms.size()} ROM(s) y ${art.size()} imagen(es) encontradas en dist/.")
    }
}

tasks.register('prepareLauncherIcon', Sync) {
    group = 'build'
    description = 'Genera el icono instalado de Android desde dist/assets/icon.png.'
    into generatedLauncherIconRes
    from(new File(repositoryDist, 'assets/icon.png')) {
        into 'mipmap-nodpi'
        rename { 'ic_launcher.png' }
    }
}

// Solo se copian las dos carpetas requeridas; no se empaqueta el resto de dist/.
tasks.register('prepareBundledGameData', Sync) {
    group = 'build'
    description = 'Prepara las ROMs y los assets que se incluirán en el APK.'
    dependsOn tasks.named('verifyBundledGameData')
    into generatedBundledAssets
    from(new File(repositoryDist, 'main/roms')) { into 'main/roms' }
    from(new File(repositoryDist, 'assets')) { into 'assets' }
}

afterEvaluate {
    tasks.named('preBuild').configure {
        dependsOn tasks.named('prepareBundledGameData'), tasks.named('prepareLauncherIcon')
    }
}

android {
    namespace 'com.sonicadvancetrilogy.launcher'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.sonicadvancetrilogy.launcher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-23', '-DSDL_SHARED=ON', '-DSDL_STATIC=OFF', '-DSDL_TEST=OFF', '-DSDL_TESTS=OFF'
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += [file("$sdlDir/android-project/app/src/main/java")]
            // Mantiene las rutas relativas main/roms/** y assets/** dentro del APK.
            // SonicAdvanceActivity las copia al directorio
            // privado de la aplicación antes de iniciar SDL/mGBA.
            assets.srcDirs += [generatedBundledAssets]
            res.srcDirs += [generatedLauncherIconRes]
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            // Mismo applicationId para que la ruta de ROMs sea igual en debug y release.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
